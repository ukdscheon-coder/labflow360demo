<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#12344c"><title>LabFlow 360 | Staff Pilot</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18364b;background:#edf3f7}*{box-sizing:border-box}body{margin:0}header{background:#12344c;color:white;padding:18px 20px}header>div{max-width:900px;margin:auto}h1{font-size:25px;margin:0 0 5px}h2{font-size:22px;margin:6px 0 12px}h3{font-size:17px;margin:8px 0}p{line-height:1.5}.wrap{max-width:900px;margin:auto;padding:15px 15px 70px}.card{background:#fff;border:1px solid #dbe5ec;border-radius:17px;padding:19px;margin:12px 0;box-shadow:0 2px 9px #152e4510}.muted{color:#627689;font-size:14px}.tag{display:inline-block;background:#e5f2fc;color:#125a8d;border-radius:18px;padding:5px 11px;font-size:12px;font-weight:750}.guide{background:#eaf4ff;border-left:5px solid #2581c0}.danger{background:#fff1ed;border-left:5px solid #ba4a31}.good{background:#eaf8f0;border-left:5px solid #298359}button{border:0;background:#176ca7;color:white;border-radius:12px;padding:14px 16px;font-size:16px;font-weight:700;min-height:50px;cursor:pointer}button:disabled{opacity:.45}button.alt{background:#e7eef4;color:#1b4562}button.red{background:#a74336}button.green{background:#147c5a}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons button{flex:1;min-width:140px}input,textarea,select{font:inherit;font-size:16px;width:100%;border:1px solid #b8cbd9;border-radius:11px;padding:12px;background:white;color:#17354c;margin:7px 0 13px}label{display:block;font-weight:700;font-size:15px;margin-top:9px}.check{display:flex;gap:10px;align-items:flex-start;padding:13px;border:1px solid #dce7ee;border-radius:12px;margin:10px 0}.check input{width:24px;height:24px;margin:0;flex-shrink:0}.check span{line-height:1.4}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar{height:9px;background:#dbe5ec;border-radius:9px;overflow:hidden;margin:15px 0}.bar>div{height:100%;background:#1a82b6;transition:width .2s}.hidden{display:none!important}.tile{display:block;width:100%;text-align:left;background:white;color:#1b4058;border:1px solid #d8e4ec;margin:11px 0;padding:18px}.tile strong{font-size:18px}.tile small{display:block;color:#647c8e;margin-top:7px;font-weight:400;line-height:1.4}.nav{display:flex;gap:8px;overflow-x:auto}.nav button{font-size:14px;min-height:42px;white-space:nowrap}.metric{font-size:30px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid>.card{margin:0}.line{padding:10px 0;border-bottom:1px solid #e6edf2;font-size:14px}footer{color:#627689;text-align:center;font-size:12px;padding:20px}button:focus-visible,input:focus-visible{outline:3px solid #faab3e;outline-offset:2px}@media(max-width:500px){.wrap{padding:11px}.card{padding:15px}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><header><div><h1>LabFlow 360 <span style="color:#7bd4fa">STAFF PILOT</span></h1><div style="font-size:13px;opacity:.85">Laboratory operations · Records · Safety checks</div></div></header><main class="wrap"><div class="nav"><button class="alt" onclick="home()">Home</button><button class="alt" onclick="summary()">Pilot results</button><button class="alt" onclick="showSafety()">Safety & privacy</button><button onclick="helpForCurrent()" aria-label="Open user guide">? Help / User Guide</button></div><section id="main"></section><footer>Illustrative workflows only · No patient data · Q-Pulse and local SOPs remain authoritative</footer></main><script>
"use strict";
const store="labflow360-staff-pilot-v2", sessionKey="labflow360-current-pilot-v2";
const flows=[
{id:"maintenance",title:"Equipment readiness",time:"3–5 min",desc:"Prepare for a routine equipment check without losing your place.",steps:[
{title:"Find the correct procedure",why:"Using an outdated SOP creates avoidable risk.",instruction:"Locate the current approved equipment SOP in Q-Pulse. Check the instrument model and version. Do not copy the demo text as a maintenance instruction.",checks:["I have opened the current approved SOP in Q-Pulse","The SOP matches the equipment I am working with"]},
{title:"Check work conditions",why:"Interruptions and poor preparation increase the chance of skipped actions.",instruction:"Before starting, check whether the instrument is available for maintenance and whether you have the required materials, following the approved SOP.",checks:["I have checked equipment availability under local procedure","I have checked the required materials and safety precautions"]},
{title:"Follow the approved maintenance procedure",why:"A reminder is not evidence that the physical task happened.",instruction:"Follow the official SOP outside this app. Return only when ready to reflect on whether the workflow was helpful. Do not use this pilot to certify maintenance.",checks:["I referred to the official procedure for the activity","I understand this pilot does not authorise equipment return to service"]},
{title:"Finish and hand over",why:"An explicit handover reduces uncertainty after interruptions.",instruction:"Complete all required records in the hospital's approved systems. Escalate any unresolved issue through local channels.",checks:["I know where the official record must be completed","I know who to contact if something remains unresolved"]}]},
{id:"temperature",title:"Storage temperature check",time:"2–4 min",desc:"A quick reminder for checks, exceptions and handover.",steps:[
{title:"Identify the correct unit",why:"A reading from the wrong unit can create false reassurance.",instruction:"Identify the fridge or freezer using its local identifier and locate its approved monitoring procedure. Do not enter any hospital identifiers into this pilot.",checks:["I have identified the correct unit using the official system","I have located the approved monitoring procedure"]},
{title:"Read and compare",why:"A number without the unit-specific approved limits is not enough.",instruction:"Review the actual monitoring display and compare with the unit's approved limits in the official procedure. This app does not calculate or certify limits.",checks:["I have checked the actual monitoring display","I have compared against the correct local limits"]},
{title:"Choose the safe pathway",why:"Temperature excursions need a documented local response.",instruction:"If anything is outside limits, stop this pilot and follow the approved escalation process. Do not use this app to release affected materials.",checks:["I have checked whether local escalation is required","I understand official recording and escalation happen outside this app"]},
{title:"Close the reminder",why:"Clear closure avoids repeated or forgotten checks.",instruction:"Record the check in the authorised system. If you are interrupted, use Resume in this pilot to return to the current reminder.",checks:["I know where to complete the official record","Any exception will be handled under local policy"]}]},
{id:"iqc",title:"IQC learning companion",time:"3–5 min",desc:"Practise decision points; never enter or release real results here.",steps:[
{title:"Confirm SOP and authorisation",why:"An SOP acknowledgement is not the same as authorisation to perform testing.",instruction:"Check the approved IQC procedure and your assigned role using hospital systems. This is a learning reminder only.",checks:["I know which approved SOP applies","I know that Q-Pulse and local authorisation remain the source of truth"]},
{title:"Understand the control gate",why:"Entering an acceptable-looking number is not proof that IQC was performed.",instruction:"In real work, IQC must be performed and evaluated using authorised analyser and laboratory systems. Do not enter actual QC values here.",checks:["I understand that a typed number cannot prove an IQC run","I know where actual IQC evidence is reviewed"]},
{title:"Respond to a deviation",why:"Continuing past an unresolved QC issue can affect reliability.",instruction:"If IQC is unacceptable, follow the approved local SOP and escalation pathway. This pilot cannot approve a repeat, release or override.",checks:["I know to follow the local deviation pathway","I will not use this pilot to authorise results"]},
{title:"Reflect and hand over",why:"Reflection can identify unclear guidance without collecting patient information.",instruction:"Use the feedback screen to say whether these reminders helped. Keep all actual QC records in official systems.",checks:["I understand where actual IQC records belong","I know how to raise questions through local channels"]}]}];
let state=null,events=[];try{let x=JSON.parse(localStorage.getItem(store)||"[]");if(Array.isArray(x))events=x.slice(-200)}catch(e){}try{let s=JSON.parse(localStorage.getItem(sessionKey)||"null");if(s&&flows.some(f=>f.id===s.flow)&&Number.isInteger(s.step))state=s}catch(e){}
function save(){try{localStorage.setItem(store,JSON.stringify(events.slice(-200)));if(state)localStorage.setItem(sessionKey,JSON.stringify(state));else localStorage.removeItem(sessionKey)}catch(e){}}
function log(type,detail){events.push({at:new Date().toISOString(),type,detail});save()}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function page(h){document.getElementById("main").innerHTML=h}
function home(){if(state){let f=flows.find(f=>f.id===state.flow);page('<div class="card guide"><span class="tag">RESUME AVAILABLE</span><h2>'+f.title+'</h2><p>Step '+(state.step+1)+' of '+f.steps.length+'. You can continue where you stopped.</p><div class="buttons"><button onclick="renderStep()">Resume</button><button class="alt" onclick="abandon()">End this session</button></div></div>')}else page('<div class="card"><span class="tag">ONE-DAY STAFF EVALUATION</span><h2>Less searching. Clearer next steps.</h2><p>Choose a task you already know. LabFlow gives short, timed reminders, a safe interruption path and a simple way to report where guidance could improve.</p><p class="muted">Do not enter patient details, real QC results, instrument identifiers, credentials or other confidential information. This is not an approved hospital system.</p></div>'+flows.map(f=>'<button class="tile" onclick="start(\''+f.id+'\')"><strong>'+f.title+'</strong><small>'+f.desc+' · '+f.time+'</small></button>').join('')+'<button class="tile" onclick="opsHome()"><strong>Laboratory operations — setup, records & review</strong><small>Register site, roles and equipment; create structured work records; flag open issues and manage review.</small></button><button class="tile" onclick="neutralLog()"><strong>Laboratory work log — generic draft</strong><small>Issue, observations, action, verification, status and handover; print to PDF.</small></button><button class="tile" onclick="hospitalPicker()"><strong>Hospital name autocomplete</strong><small>Search a starter list of UK hospital names.</small></button><button class="tile" onclick="osmolality()"><strong>Osmolality worksheet — training calculator</strong><small>Configure the result method and repeatability limits, then try fictional readings.</small></button><div class="card"><h3>Why try it?</h3><p>✓ One task at a time<br>✓ Clear next action and why it matters<br>✓ Resume after interruption<br>✓ Stop and escalate instead of guessing<br>✓ 30-second feedback for improving the process</p></div>')}
function start(id){if(state&&!confirm("End the current pilot session and start a different task?"))return;state={flow:id,step:0,started:Date.now(),blocked:0};log("start",id);renderStep()}
function renderStep(){if(!state)return home();let f=flows.find(f=>f.id===state.flow);if(!f){state=null;save();return home()}let s=f.steps[state.step];page('<div class="card"><div class="row"><span class="tag">'+safe(f.title)+'</span><span class="muted">Step '+(state.step+1)+' / '+f.steps.length+'</span></div><div class="bar"><div style="width:'+((state.step)/f.steps.length*100)+'%"></div></div><h2>'+safe(s.title)+'</h2><p>'+safe(s.instruction)+'</p></div><div class="card guide"><h3>💬 Why this step matters</h3><p>'+safe(s.why)+'</p></div><div class="card"><h3>Before you continue</h3><p class="muted">Tick each reminder only after checking the relevant official procedure. These ticks are not proof of a clinical action.</p>'+s.checks.map((v,i)=>'<label class="check"><input type="checkbox" class="gate" onchange="checkGates()"><span>'+safe(v)+'</span></label>').join('')+'<div id="msg" aria-live="polite"></div><div class="buttons"><button id="next" disabled onclick="next()">Continue →</button><button class="alt" onclick="pause()">Pause / Resume later</button></div><div class="buttons" style="margin-top:10px"><button class="red" onclick="stop()">I found a problem / need help</button></div></div>')}
function checkGates(){let a=[...document.querySelectorAll(".gate")];document.getElementById("next").disabled=!a.every(x=>x.checked);document.getElementById("msg").innerHTML=a.every(x=>x.checked)?'<p style="color:#16784d">✓ All reminders acknowledged. This is self-attestation only.</p>':'<p class="muted">Complete both reminders before continuing.</p>'}
function next(){let a=[...document.querySelectorAll(".gate")];if(!a.length||!a.every(x=>x.checked)){state.blocked++;log("blocked",state.flow+": incomplete step "+(state.step+1));document.getElementById("msg").innerHTML='<p style="color:#b13e2f">⚠ Please review both reminders first.</p>';return}let f=flows.find(f=>f.id===state.flow);log("step",state.flow+": "+(state.step+1));if(state.step===f.steps.length-1)return finish();state.step++;save();renderStep();window.scrollTo({top:0,behavior:"smooth"})}
function pause(){save();page('<div class="card guide"><h2>Safely paused</h2><p>Your position is saved on this iPad browser only. Official laboratory records remain in hospital systems.</p><button onclick="renderStep()">Resume current step</button></div>')}
function stop(){state.blocked++;log("stop",state.flow+": step "+(state.step+1));save();page('<div class="card danger"><h2>Stop and use the approved pathway</h2><p>If there is a safety concern, out-of-range result, equipment fault or uncertainty, follow the relevant hospital SOP and contact the appropriate supervisor. This app does not resolve or authorise exceptions.</p><p><strong>Do not continue a safety-critical task based on this pilot.</strong></p><div class="buttons"><button class="alt" onclick="renderStep()">Return to reminder</button><button onclick="finish(true)">End and give feedback</button></div></div>')}
function abandon(){if(!confirm("End the current session?"))return;log("abandoned",state.flow);state=null;save();home()}
function finish(stopped){let f=flows.find(f=>f.id===state.flow);state.finished=Date.now();state.stopped=!!stopped;log(stopped?"stopped":"completed",state.flow);page('<div class="card good"><h2>'+(stopped?"Session stopped safely":"Reminder journey complete")+'</h2><p>This was a guided pilot, not an official work record. Tell us whether it made your job easier.</p></div><div class="card"><h3>30-second staff feedback</h3><label>How useful was this companion?</label><select id="rating"><option value="">Choose</option><option value="5">5 — Very useful</option><option value="4">4 — Useful</option><option value="3">3 — Neutral</option><option value="2">2 — Not useful</option><option value="1">1 — Unhelpful</option></select><label>What would help most?</label><select id="benefit"><option value="">Choose</option><option value="sop">Faster access to SOP guidance</option><option value="steps">Clearer next steps</option><option value="resume">Resume after interruption</option><option value="safety">Knowing when to stop or escalate</option><option value="none">No benefit yet</option></select><label>One improvement suggestion (optional)</label><textarea id="comment" rows="3" maxlength="220" placeholder="General feedback only — no patient or staff details"></textarea><button onclick="submitFeedback()">Save anonymous feedback</button></div>')}
function submitFeedback(){let r=document.getElementById("rating").value,b=document.getElementById("benefit").value,c=document.getElementById("comment").value.trim();if(!r||!b){alert("Please select a rating and a benefit.");return}log("feedback",JSON.stringify({flow:state.flow,rating:Number(r),benefit:b,comment:c,seconds:Math.round((Date.now()-state.started)/1000),stopped:state.stopped,blocked:state.blocked}));state=null;save();page('<div class="card good"><h2>Thank you</h2><p>Your anonymous pilot feedback was saved on this iPad browser. It has not been sent to any server.</p><div class="buttons"><button onclick="home()">Try another workflow</button><button class="alt" onclick="summary()">View pilot results</button></div></div>')}
function summary(){let starts=events.filter(e=>e.type==="start"),done=events.filter(e=>e.type==="completed"),fb=events.filter(e=>e.type==="feedback"),ratings=fb.map(e=>{try{return JSON.parse(e.detail).rating}catch(x){return 0}}).filter(Boolean);let avg=ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(1):"—";page('<div class="card"><span class="tag">LOCAL PILOT RESULTS</span><h2>One-day evaluation</h2><p class="muted">Anonymous self-reported activity from this browser only. Not clinical evidence or verified staff identity.</p><div class="grid"><div class="card"><div class="metric">'+starts.length+'</div><small>Sessions started</small></div><div class="card"><div class="metric">'+done.length+'</div><small>Journeys completed</small></div><div class="card"><div class="metric">'+fb.length+'</div><small>Feedback responses</small></div><div class="card"><div class="metric">'+avg+'</div><small>Average usefulness / 5</small></div></div><div class="buttons" style="margin-top:14px"><button onclick="exportCSV()">Export anonymous CSV</button><button class="red" onclick="clearAll()">Erase pilot data</button></div></div><div class="card"><h3>Feedback highlights</h3>'+(fb.length?fb.slice(-12).reverse().map(e=>{let d;try{d=JSON.parse(e.detail)}catch(x){return""}return '<div class="line"><strong>'+safe(d.flow)+'</strong> · '+d.rating+'/5 · '+safe(d.benefit)+(d.comment?'<p>'+safe(d.comment)+'</p>':'')+'</div>'}).join(""):'<p>No feedback yet.</p>')+'</div>')}
function exportCSV(){let rows=[["time","type","detail"],...events.map(e=>[e.at,e.type,e.detail])];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="labflow360-anonymous-pilot.csv";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function clearAll(){if(!confirm("Erase ALL pilot activity and feedback stored in this browser?"))return;events=[];state=null;save();summary()}
function showSafety(){page('<div class="card danger"><h2>Safety & privacy</h2><p><strong>Evaluation only.</strong> This is not an NHS-approved application, a clinical decision system, a replacement for Q-Pulse, or an instrument interface.</p><p>Do not enter patient names, NHS numbers, sample IDs, staff identities, passwords, actual results or confidential hospital information.</p><p>The checkboxes are self-attestation and cannot verify physical tasks. All activity is stored locally in this browser and can be exported or erased by the person holding the iPad. Browser storage can be lost if cleared or private mode is used.</p><p>Always follow current approved SOPs, local safety procedures and supervisor instructions. Obtain appropriate local permission before use in the workplace.</p><button onclick="home()">Return home</button></div>')}

// Osmolality training calculator: configuration is local to this browser; no clinical use.
const osmKey="labflow360-osm-settings-v1";
const osmDefaults={method:"mean",maxDiff:5,min:0,max:2000,decimals:0};
function osmConfig(){try{let x=JSON.parse(localStorage.getItem(osmKey)||"{}");return {...osmDefaults,...x}}catch(e){return {...osmDefaults}}}
function osmolality(){let s=osmConfig();page('<div class="card"><span class="tag">TRAINING ONLY</span><h2>Osmolality Worksheet Assistant</h2><p>Use fictional readings only. Set the calculation and repeatability rules before trying the worksheet. These settings are not MKUH-approved limits.</p><div class="buttons"><button class="alt" onclick="osmSettings()">Initial settings</button><button class="alt" onclick="home()">Back to workflows</button></div></div><div class="card"><label>Value 1 (fictional)</label><input id="osm1" type="number" inputmode="decimal" oninput="osmEvaluate()" placeholder="e.g. 298"><label>Value 2 (fictional)</label><input id="osm2" type="number" inputmode="decimal" oninput="osmEvaluate()" placeholder="e.g. 299"><div id="osmOutput" aria-live="polite" class="card guide">Enter two fictional readings to calculate.</div><p class="muted">Method: '+safe(s.method)+' · Maximum repeat difference: '+s.maxDiff+' · Range: '+s.min+'–'+s.max+' · Decimals: '+s.decimals+'</p></div>')}
function osmSettings(){let s=osmConfig();page('<div class="card"><h2>Osmolality — Initial settings</h2><p class="muted">Configuration for simulation only. Real calculation and acceptance rules require local SOP approval.</p><label>Result calculation</label><select id="osmMethod"><option value="mean">Mean of Value 1 and Value 2</option><option value="first">Value 1 only</option><option value="second">Value 2 only</option></select><label>Maximum absolute difference between repeats</label><input id="osmDiff" type="number" min="0" step="any" value="'+s.maxDiff+'"><label>Minimum accepted reading</label><input id="osmMin" type="number" step="any" value="'+s.min+'"><label>Maximum accepted reading</label><input id="osmMax" type="number" step="any" value="'+s.max+'"><label>Result decimal places</label><select id="osmDecimals"><option value="0">0</option><option value="1">1</option><option value="2">2</option></select><div class="buttons"><button onclick="saveOsmSettings()">Save settings</button><button class="alt" onclick="osmolality()">Cancel</button></div></div>');document.getElementById("osmMethod").value=s.method;document.getElementById("osmDecimals").value=String(s.decimals)}
function saveOsmSettings(){let method=document.getElementById("osmMethod").value,maxDiff=Number(document.getElementById("osmDiff").value),min=Number(document.getElementById("osmMin").value),max=Number(document.getElementById("osmMax").value),decimals=Number(document.getElementById("osmDecimals").value);if([maxDiff,min,max].some(x=>!Number.isFinite(x))||maxDiff<0||min>=max||!Number.isInteger(decimals)||decimals<0||decimals>2){alert("Check settings: difference must be non-negative, minimum below maximum, and all values numeric.");return}localStorage.setItem(osmKey,JSON.stringify({method,maxDiff,min,max,decimals}));log("osm-settings","Simulation settings updated (no clinical approval)");osmolality()}
function osmEvaluate(){let a=document.getElementById("osm1").value,b=document.getElementById("osm2").value,out=document.getElementById("osmOutput");if(a===""||b===""){out.textContent="Enter both readings to calculate.";return}let x=Number(a),y=Number(b),s=osmConfig();if(!Number.isFinite(x)||!Number.isFinite(y)){out.textContent="Invalid numeric reading.";return}let diff=Math.abs(x-y),result=s.method==="first"?x:s.method==="second"?y:(x+y)/2;let valid=diff<=s.maxDiff&&x>=s.min&&x<=s.max&&y>=s.min&&y<=s.max;out.className="card "+(valid?"good":"danger");out.innerHTML="<strong>"+(valid?"SIMULATED CHECK PASS":"HOLD — SIMULATED CHECK FAILED")+"</strong><p>Calculated result: "+result.toFixed(s.decimals)+" · Repeat difference: "+diff.toFixed(2)+"</p><p>"+(valid?"Both fictional readings meet the configured training rules.":"Review repeat difference and configured limits. Do not use for patient results.")+"</p>"}

const hospitals=["Milton Keynes University Hospital","St George's Hospital","St Helier Hospital","Royal London Hospital","University College Hospital","Guy's Hospital","St Thomas' Hospital","Royal Free Hospital","Manchester Royal Infirmary","Salford Royal Hospital","Addenbrooke's Hospital","Royal Derby Hospital","Leicester Royal Infirmary","Queen's Medical Centre Nottingham","Royal Liverpool University Hospital","Bristol Royal Infirmary","Royal Sussex County Hospital","Royal Berkshire Hospital","Royal Surrey County Hospital","Frimley Park Hospital","Royal Bournemouth Hospital","Great Ormond Street Hospital","Leeds General Infirmary","Hull Royal Infirmary","John Radcliffe Hospital","Churchill Hospital","University Hospital Southampton","Royal Victoria Hospital Belfast","University Hospital of Wales","Royal Infirmary of Edinburgh","Glasgow Royal Infirmary","Aberdeen Royal Infirmary"];
function hospitalPicker(){page('<div class="card"><h2>Hospital name lookup</h2><p class="muted">Type to see suggestions. Starter list only; not a complete UK directory.</p><input id="hospitalInput" autocomplete="off" placeholder="Type hospital name" oninput="hospitalMatches()"><div id="hospitalMatches"></div><label>Import complete facility list (JSON)</label><input type="file" accept=".json,application/json" onchange="loadHospitalList(this)"><p id="importStatus" class="muted">Optional: import the supplied Excel-derived JSON file.</p><button class="alt" onclick="home()">Back</button></div>')}
function hospitalMatches(){let q=document.getElementById("hospitalInput").value.toLowerCase().trim();document.getElementById("hospitalMatches").innerHTML=q.length<2?"":[...importedHospitals,...hospitals].filter(x=>x.toLowerCase().includes(q)).slice(0,12).map(x=>'<button class="tile" onclick="document.getElementById(&quot;hospitalInput&quot;).value=this.textContent;document.getElementById(&quot;hospitalMatches&quot;).innerHTML=&quot;&quot;">'+safe(x)+'</button>').join("")}

let importedHospitals=[];try{const saved=localStorage.getItem("labflow-facility-list-v1");if(saved)importedHospitals=JSON.parse(saved)}catch(e){}
function loadHospitalList(input){let file=input.files&&input.files[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let arr=JSON.parse(reader.result);if(!Array.isArray(arr))throw Error("Expected JSON array");importedHospitals=arr.map(x=>typeof x==="string"?x:x.name).filter(Boolean);try{localStorage.setItem("labflow-facility-list-v1",JSON.stringify(importedHospitals))}catch(e){}document.getElementById("importStatus").textContent=importedHospitals.length+" facility names loaded and saved in this browser.";hospitalMatches()}catch(e){document.getElementById("importStatus").textContent="Unable to read facility JSON: "+e.message}};reader.readAsText(file)}
function neutralLog(){page('<div class="card"><span class="tag">DRAFT ONLY</span><h2>Laboratory work log</h2><p class="muted">Neutral format: reported issue, observations, actions, verification, status and handover. Do not enter identifiable or confidential information into this public pilot.</p><label>Hospital / facility</label><input id="hospitalInput" autocomplete="off" oninput="hospitalMatches()" placeholder="Search hospital name"><div id="hospitalMatches"></div><label>Work area</label><input id="logArea" placeholder="Training work area"><label>Reported issue</label><textarea id="logIssue" placeholder="Fictional example"></textarea><label>Observations</label><textarea id="logObservation"></textarea><label>Actions taken</label><textarea id="logAction"></textarea><label>Verification</label><textarea id="logVerification"></textarea><label>Final status</label><select id="logStatus"><option>Open</option><option>In progress</option><option>Resolved</option><option>Escalated</option></select><label>Handover notes</label><textarea id="logHandover"></textarea><div class="buttons"><button onclick="printNeutralLog()">Print / Save PDF</button><button class="alt" onclick="home()">Home</button></div></div>')}
function printNeutralLog(){window.print()}

const helpTopics={
home:["Getting started","Choose a workflow from Home. Each screen gives one action at a time. Use Pause to resume later. All official work stays in approved systems."],
hospital:["Hospital autocomplete","Start typing at least two characters. Select a matching facility. For the full supplied UK/Ireland Excel list, import the JSON once on the Hospital name lookup screen; the list then works across the current browser session. Do not treat a suggestion as proof of identity."],
log:["Laboratory work log","Use the generic draft to capture a fictional issue, observations, action, verification, final status and handover. Review all fields before printing. This is not an official clinical record."],
osm:["Osmolality settings","Open Initial settings, choose mean/first/second calculation, set maximum repeat difference and allowed range. Save, then enter fictional readings. Rules are for simulation only until approved against local SOP."],
pilot:["Guided workflow","Read the current official SOP in Q-Pulse first. Tick reminders only after checking them. Use Stop / Need Help for uncertainty; do not use the pilot to approve real work."],
results:["Pilot results","After a journey, enter anonymous feedback. Open Pilot results to view counts and ratings or export a CSV. Data remains in this browser unless you export it."],
privacy:["Privacy and safety","Never enter patient details, confidential results, credentials or staff identifiers in this public evaluation. Browser-local data is not an approved hospital record."]
};
function showHelp(topic){let t=helpTopics[topic]||helpTopics.home;let old=document.getElementById("helpPanel");if(old)old.remove();let el=document.createElement("div");el.id="helpPanel";el.setAttribute("role","dialog");el.setAttribute("aria-label","User guide");el.style.cssText="position:fixed;inset:0;background:#0b223c99;z-index:9999;display:flex;align-items:center;justify-content:center;padding:15px";el.innerHTML='<div class="card" style="max-width:560px;max-height:90vh;overflow:auto;width:100%;box-shadow:0 12px 35px #1115"><div class="row"><h2>Help · '+safe(t[0])+'</h2><button class="alt" onclick="closeHelp()" aria-label="Close guide">✕</button></div><p>'+safe(t[1])+'</p><h3>More guides</h3><div class="buttons">'+Object.keys(helpTopics).map(k=>'<button class="alt" onclick="showHelp(\''+k+'\')">'+safe(helpTopics[k][0])+'</button>').join("")+'</div></div>';document.body.appendChild(el)}
function closeHelp(){document.getElementById("helpPanel")?.remove()}
function helpForCurrent(){let t=document.getElementById("main")?.innerText||"";showHelp(t.includes("Osmolality")?"osm":t.includes("Hospital name")?"hospital":t.includes("Laboratory work log")?"log":t.includes("Pilot results")?"results":t.includes("Step ")?"pilot":"home")}

const opsKey="labflow-ops-v1";
let ops;try{ops=JSON.parse(localStorage.getItem(opsKey)||"null")}catch(e){}if(!ops||!Array.isArray(ops.records))ops={site:"",department:"",lead:"",primary:"",deputy:"",reviewer:"",equipment:[],records:[],audit:[]};
function opsSave(){try{localStorage.setItem(opsKey,JSON.stringify(ops))}catch(e){alert("Storage unavailable. Export before leaving.")}}
function opsAudit(action,id){ops.audit.push({time:new Date().toISOString(),action,id});opsSave()}
function opsSetup(){page('<div class="card"><h2>Initial laboratory setup</h2><p class="muted">Pilot configuration stored only on this device. Use fictional staff identities for public evaluation.</p><label>Hospital</label><input id="site" value="'+safe(ops.site)+'" placeholder="Hospital name"><label>Department</label><input id="dept" value="'+safe(ops.department)+'" placeholder="e.g. Chemistry"><label>Accountable lead</label><input id="lead" value="'+safe(ops.lead)+'"><label>Primary responsible person</label><input id="primary" value="'+safe(ops.primary)+'"><label>Deputy</label><input id="deputy" value="'+safe(ops.deputy)+'"><label>Designated reviewer</label><input id="reviewer" value="'+safe(ops.reviewer)+'"><button onclick="saveOpsSetup()">Save setup</button></div><div class="card"><h3>Registered equipment</h3>'+ops.equipment.map(e=>'<div class="line">'+safe(e.name)+' · '+safe(e.id)+' · '+safe(e.location)+'<p class="muted">'+safe(e.caution)+'</p></div>').join("")+'<label>Equipment name</label><input id="eqName" placeholder="Generic analyser A"><label>Equipment ID</label><input id="eqId" placeholder="TRAINING-01"><label>Location</label><input id="eqLocation" placeholder="Work area"><label>Equipment-specific caution</label><textarea id="eqCaution" placeholder="Enter approved local caution"></textarea><button onclick="addEquipment()">Register equipment</button></div>')}
function saveOpsSetup(){ops.site=document.getElementById("site").value.trim();ops.department=document.getElementById("dept").value.trim();ops.lead=document.getElementById("lead").value.trim();ops.primary=document.getElementById("primary").value.trim();ops.deputy=document.getElementById("deputy").value.trim();ops.reviewer=document.getElementById("reviewer").value.trim();if(!ops.site||!ops.department||!ops.lead||!ops.primary||!ops.deputy||!ops.reviewer){alert("Complete all setup fields.");return}opsAudit("setup updated","configuration");opsHome()}
function addEquipment(){let name=document.getElementById("eqName").value.trim(),id=document.getElementById("eqId").value.trim(),location=document.getElementById("eqLocation").value.trim(),caution=document.getElementById("eqCaution").value.trim();if(!name||!id||!location||!caution){alert("Complete equipment details and caution.");return}if(ops.equipment.some(e=>e.id===id)){alert("Equipment ID already registered.");return}ops.equipment.push({name,id,location,caution});opsAudit("equipment registered",id);opsSetup()}
function opsHome(){page('<div class="card"><span class="tag">OPERATIONS PILOT</span><h2>Laboratory operations</h2><p>'+safe(ops.site||"Site not configured")+' · '+safe(ops.department||"Department not configured")+'</p><div class="buttons"><button onclick="opsSetup()">Initial setup / Equipment</button><button onclick="newOpsRecord()">New work record</button><button class="alt" onclick="opsHistory()">Records & handover</button></div></div><div class="grid"><div class="card"><div class="metric">'+ops.equipment.length+'</div><small>Registered equipment</small></div><div class="card"><div class="metric">'+ops.records.filter(r=>r.status!=="Reviewed").length+'</div><small>Awaiting review</small></div></div><div class="card guide"><h3>How this prevents omissions</h3><p>Records require a registered equipment ID, work description, outcome, actions, and explicit issue status. Unresolved issues cannot be marked as reviewed.</p></div>')}
function newOpsRecord(){if(!ops.site||!ops.department||!ops.equipment.length){page('<div class="card danger"><h2>Setup required</h2><p>Register your laboratory and at least one piece of equipment before creating a record.</p><button onclick="opsSetup()">Open initial setup</button></div>');return}page('<div class="card"><h2>New work record</h2><p class="muted">Fictional evaluation data only. This is not a validated clinical record.</p><label>Equipment</label><select id="workEq">'+ops.equipment.map(e=>'<option value="'+safe(e.id)+'">'+safe(e.name)+' — '+safe(e.id)+'</option>').join("")+'</select><label>Operator (training identity)</label><input id="operator" placeholder="Operator alias"><label>Work type</label><select id="workType"><option>Routine check</option><option>Maintenance</option><option>Quality check</option><option>Incident / fault</option><option>Shift handover</option></select><label>Work performed</label><textarea id="workDone"></textarea><label>Observation / result</label><textarea id="workResult"></textarea><label>Action taken</label><textarea id="workAction"></textarea><label>Issue status</label><select id="workIssue"><option value="none">No issue identified</option><option value="open">Open issue — follow-up required</option><option value="escalated">Escalated — follow-up required</option></select><button onclick="saveOpsRecord()">Save draft record</button></div>')}
function saveOpsRecord(){let get=id=>document.getElementById(id).value.trim();let ids=["workEq","operator","workType","workDone","workResult","workAction","workIssue"];if(ids.some(id=>!get(id))){alert("All fields are mandatory. Missing details cannot be recorded as completed.");return}let r={id:"REC-"+Date.now(),at:new Date().toISOString(),equipment:get("workEq"),operator:get("operator"),type:get("workType"),done:get("workDone"),result:get("workResult"),action:get("workAction"),issue:get("workIssue"),status:"Awaiting review",reviewer:"",reviewedAt:""};ops.records.push(r);opsAudit("record created",r.id);opsHistory()}
function opsHistory(){page('<div class="card"><h2>Records & shift handover</h2><p class="muted">Draft local pilot records. No verified identity, central database or immutable audit trail.</p><div class="buttons"><button onclick="newOpsRecord()">New record</button><button class="alt" onclick="opsHome()">Dashboard</button><button class="alt" onclick="exportOps()">Export JSON</button></div></div>'+ops.records.slice().reverse().map(r=>'<div class="card"><span class="tag">'+safe(r.status)+'</span><h3>'+safe(r.type)+' · '+safe(r.equipment)+'</h3><p class="muted">'+safe(r.id)+' · '+safe(r.at)+'</p><p><strong>Work:</strong> '+safe(r.done)+'</p><p><strong>Result:</strong> '+safe(r.result)+'</p><p><strong>Action:</strong> '+safe(r.action)+'</p><p><strong>Issue:</strong> '+safe(r.issue)+'</p>'+(r.status!=="Reviewed"?'<button onclick="reviewOps(\''+r.id+'\')">Review / close</button>':'<p>Reviewed by '+safe(r.reviewer)+'</p>')+'</div>').join(""))}
function reviewOps(id){let r=ops.records.find(x=>x.id===id);if(!r)return;if(r.issue!=="none"){alert("Open or escalated issues cannot be closed here. Follow the official escalation process.");return}let reviewer=prompt("Enter reviewer training identity (not verified):");if(!reviewer||!reviewer.trim()||reviewer.trim().toLowerCase()===r.operator.toLowerCase()){alert("A separate reviewer identity is required.");return}r.reviewer=reviewer.trim();r.reviewedAt=new Date().toISOString();r.status="Reviewed";opsAudit("review self-attested",id);opsHistory()}
function exportOps(){let blob=new Blob([JSON.stringify(ops,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="labflow-operations-pilot.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
home();
</script></body></html>
