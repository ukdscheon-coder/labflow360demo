name: Keyless official regulation API monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '43 5 * * *'
permissions:
  contents: write
  issues: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch official API metadata
        run: python scripts/keyless_regulatory_api.py
      - name: Commit audit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regulatory-api-snapshots.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh keyless regulatory API monitoring metadata"
            git push
          fi
      - name: Open review issue for source changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,subprocess,datetime
          d=json.load(open('regulatory-api-snapshots.json'))
          changed=[s for s in d['sources'] if s.get('changed')]
          if changed:
              body="API content changed; NOT a verified legal amendment. Review applicability, official legal text, version, publication and effective dates before using.\n\n"+'\n'.join('- '+x['id']+': '+x['endpoint'] for x in changed)
              subprocess.run(['gh','issue','create','--title','Keyless regulatory API changes '+datetime.date.today().isoformat(),'--body',body],check=True)
          PY
